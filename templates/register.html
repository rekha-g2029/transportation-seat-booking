{% extends "base.html" %}{% block title %}Register · College Transit{% endblock %}{% block content %}<div class="form-wrap"><div class="form-card"><p class="eyebrow">STUDENT ACCOUNT</p><h1>Create account</h1><p class="muted-text">Use your college email address.</p><form method="post"><label>Full name<input name="full_name" required maxlength="100" autocomplete="name"></label><label>College email<input name="email" type="email" required autocomplete="email" placeholder="you@college.edu"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><button class="button full">Create account</button></form><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></div>{% endblock %}
